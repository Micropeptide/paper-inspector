[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperinspector"
version = "0.1.0"
description = "Paste a DOI, get an integrity and quality check of the paper, its figures, data, supplementary files and references."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "opencv-contrib-python-headless>=4.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
paperinspector = "paperinspector.cli:main"
pinspect = "paperinspector.cli:main"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
