<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Screen a scientific paper for image, data, statistics and reference problems." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b2026" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Paper Inspector</title>
    <script>
      // Apply the saved theme before the first paint, so a dark-mode choice never flashes white.
      try {
        var t = JSON.parse(localStorage.getItem("pi.theme") || '"system"');
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
